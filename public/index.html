<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lista de la compra</title>
  <meta name="description" content="Lista de la compra compartida con comparador de precios entre Lidl, Aldi, Plus Fresc y Esclat." />

  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0ea968" />
  <link rel="icon" href="/icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Compra" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="hero__brand">
        <span class="hero__logo">🛒</span>
        <div>
          <h1>Lista de la compra</h1>
          <p class="hero__tagline">Comparador de precios para vosotros dos</p>
        </div>
      </div>
      <ul class="store-chips">
        <li class="store-chip" data-store="lidl">Lidl</li>
        <li class="store-chip" data-store="aldi">Aldi</li>
        <li class="store-chip" data-store="plusfresc">Plus Fresc</li>
        <li class="store-chip" data-store="esclat">Esclat</li>
      </ul>
    </header>

    <main class="content">
      <form id="add-form" class="add-form">
        <svg class="add-form__icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input
          id="product-input"
          type="text"
          placeholder="Añadir producto, ej. leche"
          autocomplete="off"
          required
        />
        <button type="submit" class="add-form__button" aria-label="Añadir producto">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 5V19M5 12H19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </button>
      </form>

      <div id="suggestions" class="suggestions"></div>

      <section class="panel">
        <div class="panel__header">
          <h2>Vuestra lista</h2>
          <span id="product-count" class="panel__count">0</span>
        </div>

        <ul id="product-list" class="product-list"></ul>

        <div id="empty-state" class="empty-state">
          <span class="empty-state__icon">🧺</span>
          <p>La lista está vacía.<br />Añade lo que soláis comprar.</p>
        </div>
      </section>

      <section id="comparison" class="panel" hidden>
        <div class="panel__header">
          <h2>Mejor precio por producto</h2>
        </div>
        <div id="comparison-results"></div>
      </section>

      <div class="spacer"></div>
    </main>

    <div class="action-bar">
      <button id="compare-button" type="button" class="button button--primary">
        <span class="button__label">Comparar precios</span>
        <span class="button__spinner" hidden></span>
      </button>
      <button id="clear-button" type="button" class="button button--ghost" aria-label="Vaciar lista">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M4 7H20M9 7V5C9 4.4 9.4 4 10 4H14C14.6 4 15 4.4 15 5V7M18 7L17.2 19C17.1 19.9 16.4 20.5 15.5 20.5H8.5C7.6 20.5 6.9 19.9 6.8 19L6 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Boot-whatsapp · Lista de la compra</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>🛒 Lista de la compra</h1>
      <p class="app__subtitle">Lidl · Aldi · Plus Fresc · Esclat</p>
    </header>

    <form id="add-form" class="add-form">
      <input
        id="product-input"
        type="text"
        placeholder="Añadir producto (ej. leche)"
        autocomplete="off"
        required
      />
      <button type="submit">Añadir</button>
    </form>

    <section>
      <ul id="product-list" class="product-list"></ul>
      <p id="empty-message" class="empty-message" hidden>
        Tu lista está vacía. Añade productos arriba.
      </p>
    </section>

    <div class="actions">
      <button id="compare-button" type="button" class="primary">Comparar precios</button>
      <button id="clear-button" type="button" class="secondary">Vaciar lista</button>
    </div>

    <section id="comparison" class="comparison" hidden>
      <h2>Comparativa de precios</h2>
      <div id="comparison-results"></div>
    </section>

    <p id="status-message" class="status-message" role="status"></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
